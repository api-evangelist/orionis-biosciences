openapi: 3.1.0
info:
  title: Orionis Biosciences Website Content API (WordPress REST)
  version: wp/v2
  summary: Anonymous read API over the Orionis Biosciences corporate site content.
  description: 'Orionis Biosciences (orionisbio.com) runs on WordPress and exposes the WordPress REST API publicly
    and anonymously at https://orionisbio.com/wp-json/. This document was DERIVED mechanically from that host''s
    own self-describing route index — no path, parameter, type, default, enum or description here was authored by
    API Evangelist. Component schema properties were derived from live observed responses, because HTTP OPTIONS
    (the usual WordPress schema channel) is blocked by the site firewall on this host and returns 403.


    This is a site-content API, not a drug-discovery or scientific product API. Orionis Biosciences publishes no
    developer program and no product API. The surface serves news posts (`posts`, 22 published), corporate and platform
    pages (`pages`, 16 published), the media library (208 items), the leadership and scientific-team custom post
    type (`orionis_team`, 15 published), the `category` taxonomy (5 terms) and a site-wide search endpoint. Read
    operations require no credentials; write operations require WordPress authentication (application password or
    cookie+nonce) and are not available to the public.


    Scope note: the live host also registers third-party plugin and hosting ADMIN namespaces (yoast/v1, wpaas/v1,
    akismet/v1, objectcache/v1, ai1wm/v1, two-factor, wp-site-designer/v1, gdl/v1, wp-site-health/v1, wp-block-editor/v1).
    Those are real but are vendor control planes rather than Orionis Biosciences'' content surface, so they are
    excluded here and recorded in conventions/orionis-biosciences-conventions.yml. The `wp-abilities/v1` namespace
    — the WordPress Abilities API, the registry MCP adapters expose as tools — is registered on this host but returns
    HTTP 401 `rest_forbidden` anonymously, so its ability set could not be enumerated. The complete verbatim route
    index is preserved at openapi/_original/orionis-biosciences-wp-json-index.json.'
  contact:
    name: Orionis Biosciences
    url: https://orionisbio.com/contact/
  x-derived-from: https://orionisbio.com/wp-json/
  x-derived-on: '2026-08-04'
  x-derived-by: API Evangelist enrichment pipeline (0-working/pipeline-enrich.md)
  x-not-a-provider-published-spec: true
