format: wordpress-rest-error
rfc9457: false
envelope:
  media_type: application/json
  note: >-
    The WordPress REST API does not use RFC 9457 problem+json. Every non-2xx response is a JSON
    object with `code` (machine-readable slug), `message` (human-readable string) and
    `data.status` (the HTTP status repeated in the body). Orionis Biosciences publishes no error
    reference of its own; the codes below were observed live on orionisbio.com or are the standard
    WordPress core codes for the registered routes.
  fields:
  - name: code
    type: string
    description: Machine-readable error slug, e.g. rest_forbidden.
  - name: message
    type: string
    description: Human-readable message.
  - name: data.status
    type: integer
    description: HTTP status code repeated in the body.
problems:
- status: 400
  code: rest_invalid_param
  title: Invalid parameter
  detail: A query parameter failed the schema registered for the route (type, enum, minimum or maximum).
  remediation: >-
    Check the parameter against the OpenAPI — for example `per_page` is capped at 100 and `context`
    accepts only view/embed on anonymous requests.
  observed: false
  source: openapi/orionis-biosciences-content-openapi.yml
- status: 401
  code: rest_forbidden
  title: Not authenticated or not permitted
  detail: >-
    The route requires WordPress authentication. Observed live on
    /wp-json/wp/v2/settings, /wp-json/wp-abilities/v1/abilities,
    /wp-json/wp-abilities/v1/categories and /wp-json/yoast/v1/statistics.
  remediation: >-
    Authenticate with a WordPress Application Password over HTTP Basic. Credentials are not issued
    to the public; these routes are administrative.
