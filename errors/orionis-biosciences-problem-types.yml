- status: 403
  code: firewall-block
  title: Blocked by the site firewall
  detail: >-
    orionisbio.com sits behind a Sucuri gateway that returns an HTML 403 page — not a JSON error
    envelope — for some request shapes. Observed on HTTP OPTIONS to every /wp/v2 collection and on
    GET /wp-json/wp/v2/users. Callers must handle a non-JSON body on 403.
  remediation: >-
    Use GET rather than OPTIONS for discovery; the route index at /wp-json/ carries the same
    parameter metadata that OPTIONS would return.
  observed: true
  observed_on:
  - https://orionisbio.com/wp-json/wp/v2/users
  - OPTIONS https://orionisbio.com/wp-json/wp/v2/posts
