aid: orionis-biosciences
name: Orionis Biosciences
description: 'Orionis Biosciences is a privately held biotechnology company headquartered at 950
  Winter Street in Waltham, Massachusetts, with a research site in Ghent, Belgium, co-founded by
  Niko Kley and Jan Tavernier. It develops precision medicines across three modalities — small
  molecule molecular glues built on its Allo-Glue platform, conditional and cis-targeted cytokines
  built on its A-Kine platform, and multi-specific cell engagers built on its MCE platform —
  combining disease biology, immunology, chemistry, protein engineering, computational science and
  machine learning at genome scale. Its lead A-Kine program ORB-011, an attenuated cis-targeted
  interferon immunotherapy, has entered Phase 1. Orionis has run multi-year molecular-glue discovery
  collaborations with Genentech (2023, and a 2025 expansion with $105M upfront and more than $2B in
  potential milestones) and Novartis (from 2020, expanded in 2026 with $40M upfront and up to $1.4B
  in milestones). Orionis Biosciences publishes no developer program, no product API and no OpenAPI
  of its own; the only machine-readable surface on orionisbio.com is the WordPress REST API (wp/v2)
  that serves the company newsroom, corporate and platform pages, leadership and scientific-team
  profiles and the media library as anonymously readable JSON, alongside a WordPress Abilities API
  (wp-abilities/v1) registry that is present but authentication-gated.'
