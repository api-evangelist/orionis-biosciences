  detail: >-
    Orionis Biosciences runs no developer program, but contract discovery found a real
    provider-served machine-readable surface — the WordPress REST route index at
    https://orionisbio.com/wp-json/ (HTTP 200), whose wp/v2 namespace returns the newsroom,
    platform pages, the orionis_team profiles and the media library anonymously. That index was
    saved verbatim and the OpenAPI, data model, error catalog, conventions and skills were derived
    from it.
