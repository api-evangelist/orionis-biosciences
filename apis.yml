apis:
- aid: orionis-biosciences:content
  name: Orionis Biosciences Website Content API (WordPress REST wp/v2)
  description: 'The anonymously readable WordPress REST API that orionisbio.com serves at
    /wp-json/wp/v2 — company news posts (22 published), corporate and platform pages (16 published,
    covering the Allo-Glue, A-Kine and MCE Cell Engager platforms plus the pipeline), leadership and
    scientific-team profiles as the `orionis_team` custom post type (15 published), the media library
    (208 items), the `category` taxonomy (5 terms), post-type/taxonomy/status discovery documents and
    a site-wide search endpoint, all as JSON with page/per_page pagination and X-WP-Total /
    X-WP-TotalPages response headers. This is the CMS content API, not an Orionis product or
    drug-discovery API; Orionis Biosciences publishes no OpenAPI for it, so the definition in this
    repo was derived mechanically from the live route-discovery document at
    https://orionisbio.com/wp-json/. Write operations are registered on these routes but require
    WordPress Application Password or cookie+nonce authentication.'
  humanURL: https://orionisbio.com/news/
  baseURL: https://orionisbio.com/wp-json/wp/v2
