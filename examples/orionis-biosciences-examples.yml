- name: pagination-headers
  operationId: getWpV2Posts
  description: >-
    Pagination is page-number based. Totals come back in X-WP-Total / X-WP-TotalPages and prev/next
    are advertised in a standard RFC 5988 Link header.
  request:
    method: GET
    url: https://orionisbio.com/wp-json/wp/v2/posts?per_page=2&page=2
  response:
    status: 200
    headers:
      X-WP-Total: '22'
      X-WP-TotalPages: '11'
      Link: <https://orionisbio.com/wp-json/wp/v2/posts?per_page=2&page=1>; rel="prev",
        <https://orionisbio.com/wp-json/wp/v2/posts?per_page=2&page=3>; rel="next"
      Access-Control-Expose-Headers: X-WP-Total, X-WP-TotalPages, Link
